paper:
  slug: learning-multi-scale-knowledge-guided-features-for-text-guided-face-recognition
  title: "Learning Multi-Scale Knowledge-Guided Features for Text-Guided Face Recognition"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  embed_dim: 512
  pretrained_backbone: true
  attr_dim: 40
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 64
  epochs: 12
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  lambda_id: 1.0
  lambda_global: 0.5
  lambda_local: 0.5
  lambda_attr: 0.2
  temperature: 0.07
eval:
  batch_size: 128
  max_lfw_pairs: null
  max_calfw_pairs: null
  max_cplfw_pairs: null
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
